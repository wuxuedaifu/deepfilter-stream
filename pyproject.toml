[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfilter-stream"
dynamic = ["version"]
description = "Real-time streaming noise cancellation with DeepFilterNet3 on ONNX Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fu Dai", email = "wuxuedaifu@gmail.com" }]
keywords = ["noise-suppression", "speech-enhancement", "deepfilternet", "real-time", "onnx"]
dependencies = [
    "numpy>=1.21",
    "onnxruntime>=1.16",
    "soxr>=0.3",
    "sounddevice>=0.4",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "soundfile>=0.12"]

[project.scripts]
deepfilter-stream = "deepfilter_stream.live:main"

[project.urls]
Homepage = "https://github.com/wuxuedaifu/deepfilter-stream"
Issues = "https://github.com/wuxuedaifu/deepfilter-stream/issues"

[tool.hatch.version]
path = "src/deepfilter_stream/_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfilter_stream"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmarks (deselect with -m 'not slow')"]
