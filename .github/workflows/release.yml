name: release
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write   # required for PyPI Trusted Publishing (OIDC)
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
